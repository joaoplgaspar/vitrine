# Publica o compilador web (web/ + src/vitrine) no GitHub Pages a cada push na main.
# Uma vez: Settings → Pages → Source: "GitHub Actions".
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python web/construir.py
      # Nome do artefato inclui a tentativa: ao reexecutar o job, os artefatos
      # das tentativas anteriores continuam no run e o deploy-pages recusa
      # mais de um artefato com o mesmo nome.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
