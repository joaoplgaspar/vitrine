[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine"
version = "0.1.0"
description = "Vitrine: linguagem declarativa para regras de promoção de loja virtual"
requires-python = ">=3.10"
dependencies = ["lark>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vitrine = "vitrine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitrine = ["grammar.lark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
